  <circle cx="160" cy="80" r="30" fill="none" stroke="#6b7280" stroke-width="0.6" opacity="0.5"/>
  <!-- iris texture lines -->
  <g stroke="#9ca3af" stroke-width="0.5" opacity="0.4">
    <line x1="160" y1="36" x2="158" y2="50"/>
    <line x1="178" y1="39" x2="173" y2="52"/>
    <line x1="193" y1="48" x2="185" y2="58"/>
    <line x1="202" y1="62" x2="191" y2="68"/>
    <line x1="204" y1="80" x2="192" y2="80"/>
    <line x1="202" y1="98" x2="191" y2="92"/>
    <line x1="193" y1="112" x2="185" y2="102"/>
    <line x1="178" y1="121" x2="173" y2="108"/>
    <line x1="160" y1="124" x2="158" y2="110"/>
    <line x1="142" y1="121" x2="147" y2="108"/>
    <line x1="127" y1="112" x2="135" y2="102"/>
    <line x1="118" y1="98" x2="129" y2="92"/>
    <line x1="116" y1="80" x2="128" y2="80"/>
    <line x1="118" y1="62" x2="129" y2="68"/>
    <line x1="127" y1="48" x2="135" y2="58"/>
    <line x1="142" y1="39" x2="147" y2="52"/>
  </g>
  <!-- pupil -->
  <circle cx="160" cy="80" r="20" fill="#111111"/>
