  <circle cx="153" cy="73" r="5" fill="#ffffff" opacity="0.6"/>
  <circle cx="168" cy="85" r="2.5" fill="#ffffff" opacity="0.3"/>
  <!-- eyelash hints top -->
  <g stroke="#111111" stroke-width="1.5" stroke-linecap="round">
    <line x1="100" y1="38" x2="97"  y2="28"/>
    <line x1="120" y1="27" x2="119" y2="17"/>
    <line x1="140" y1="21" x2="140" y2="11"/>
    <line x1="160" y1="20" x2="160" y2="10"/>
    <line x1="180" y1="21" x2="181" y2="11"/>
    <line x1="200" y1="27" x2="202" y2="17"/>
    <line x1="218" y1="37" x2="222" y2="28"/>
  </g>
