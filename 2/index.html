<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DECIPHER II</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="A mobile puzzle game. No hints. 20 new levels.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="DECIPHER II">
  <meta property="og:description" content="A mobile puzzle game. No hints. 20 new levels.">
  <meta property="og:url" content="https://decipher.shiftingradius.com/2">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DECIPHER II">
  <meta name="twitter:description" content="A mobile puzzle game. No hints. 20 new levels.">
  <link rel="stylesheet" href="style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f0eeeb;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 32px 3rem;
    }

    .logo {
      font-family: 'Courier New', monospace;
      font-size: clamp(3rem, 16vw, 5rem);
      font-weight: bold;
      letter-spacing: 0.12em;
      color: #111;
      text-align: center;
      line-height: 1;
    }

    .divider {
      width: 40px;
      height: 1.5px;
      background: #ccc;
      margin: 28px auto;
    }

    .intro {
      font-family: 'Courier New', monospace;
      font-size: clamp(0.88rem, 4vw, 1rem);
      color: #555;
      text-align: center;
      line-height: 2.2;
      letter-spacing: 0.04em;
      max-width: 300px;
    }

    .btn-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 44px;
      width: 100%;
    }

    .btn {
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      letter-spacing: 0.2em;
      border: none;
      border-radius: 24px;
      padding: 14px 52px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      width: min(280px, 80vw);
    }

    .btn-start {
      background: #111;
      color: #f0eeeb;
    }

    .btn-resume {
      background: transparent;
      color: #111;
      border: 1.5px solid #ccc;
    }

    .progress-txt {
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      color: #999;
      letter-spacing: 0.12em;
      margin-top: 10px;
      text-align: center;
    }

    .d1-link {
      position: fixed;
      bottom: 28px;
      left: 0; right: 0;
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      color: #aaa;
      text-decoration: none;
      padding: 8px;
    }

    .d1-link:active { color: #999; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <p class="logo">DECIPHER II</p>

  <div class="divider"></div>

  <p class="intro">
    You are a brave breed.<br>
    Welcome to 20 new levels.<br>
    As usual, no hints.<br>
    Figure as you go.
  </p>

  <div class="btn-col">
    <button class="btn btn-start" id="startBtn">START</button>
    <button class="btn btn-resume hidden" id="resumeBtn">RESUME</button>
    <p class="progress-txt hidden" id="progressTxt"></p>
  </div>

  <a class="d1-link" href="https://decipher.shiftingradius.com">
    If you are here without solving the first 30 levels, click here.
  </a>

  <script src="utils2.js"></script>
  <script>
    desktopBlock();

    // Level map: progress number (1–20) → folder
    var LEVELS = [
      'levels/01/',
      'levels/key/',
      'levels/palette/',
      'levels/solar/',
      'levels/brainrot/',
      'levels/echo/',
      'levels/beyond/',
      'levels/combination/',
      'levels/brain/',
      'levels/firefly/',
      'levels/sherlock/',
      'levels/qr/',
      'levels/sequence/',
      'levels/forward/',
      'levels/disputed/',
      'levels/mines/',
      'levels/matrix/',
      'levels/frequency/',
      'levels/connections/',
      'levels/hold/',
    ];

    var saved     = parseInt(localStorage.getItem('d2progress') || '0', 10);
    var startBtn  = document.getElementById('startBtn');
    var resumeBtn = document.getElementById('resumeBtn');
    var progTxt   = document.getElementById('progressTxt');

    if (saved > 0 && saved < LEVELS.length) {
      resumeBtn.classList.remove('hidden');
      progTxt.classList.remove('hidden');
      progTxt.textContent = saved + ' of 20 levels done';

      resumeBtn.addEventListener('touchend', function(e) {
        e.preventDefault();
        window.location.href = LEVELS[saved];
      });
      resumeBtn.addEventListener('click', function() {
        window.location.href = LEVELS[saved];
      });
    }

    startBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      window.location.href = LEVELS[0];
    });
    startBtn.addEventListener('click', function() {
      window.location.href = LEVELS[0];
    });
  </script>
</body>
</html>
