<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DECIPHER 2</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../style.css">
  <style>
    body {
      background: #05060f;
      overflow: hidden;
      padding: 0;
    }

    .badge, .home-link {
      color: rgba(255,255,255,0.18);
      z-index: 10;
    }

    .clue {
      position: fixed;
      top: 3.2rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.38);
      line-height: 2;
      pointer-events: none;
      z-index: 5;
    }

    #gameCanvas {
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    .hint-text {
      position: fixed;
      bottom: 3.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.15);
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .hint-text.visible { opacity: 1; }

    .reveal-text {
      position: fixed;
      bottom: 3.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 1rem;
      letter-spacing: 0.18em;
      color: #7ec8a4;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .reveal-text.visible { opacity: 1; }
  </style>
</head>
<body>
  <span class="badge">34</span>
  <a href="../../index.html" class="home-link">HOME</a>

  <p class="clue">By the time you see it,<br>it's already gone.</p>
  <canvas id="gameCanvas"></canvas>
  <p class="hint-text" id="hintText">drag to position</p>
  <p class="reveal-text" id="revealText">8 light minutes</p>

  <script src="../../utils2.js"></script>
  <script>
    desktopBlock();

    var canvas    = document.getElementById('gameCanvas');
    var ctx       = canvas.getContext('2d');
    var hint      = document.getElementById('hintText');
    var revealEl  = document.getElementById('revealText');

    var STOPS     = 20;
    var TARGET    = 8;
    var SUN_R     = 26;
    var EARTH_R   = 9;

    var completed    = false;
    var locked       = false;
    var lockTimer    = null;
    var currentStop  = 1;
    var dragging     = false;
    var startTime    = Date.now();

    var W, H, pathY, pathStart, pathEnd;
    var stars = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
      pathY     = Math.round(H * 0.54);
      pathStart = SUN_R * 2 + 28;
      pathEnd   = W - 22;
      if (stars.length === 0) {
        for (var i = 0; i < 70; i++) {
          stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.1 + 0.2,
            a: Math.random() * 0.5 + 0.15,
            sp: Math.random() * 1.5 + 0.4
          });
        }
      }
    }
    window.addEventListener('resize', resize);
    resize();

    setTimeout(function () { hint.classList.add('visible'); }, 1800);

    function stopX(i) {
      return pathStart + (i - 1) / (STOPS - 1) * (pathEnd - pathStart);
    }

    function nearestStop(x) {
      var frac = (x - pathStart) / (pathEnd - pathStart);
      var s = Math.round(frac * (STOPS - 1)) + 1;
      return Math.max(1, Math.min(STOPS, s));
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      var t = (Date.now() - startTime) / 1000;

      // Stars
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var tw = s.a + Math.sin(t * s.sp + s.x * 0.05) * 0.1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + tw + ')';
        ctx.fill();
      }

      // Sun
      var sunX = SUN_R + 14;
      var pulse = Math.sin(t * 1.3) * 0.08 + 0.92;

      var sg = ctx.createRadialGradient(sunX, pathY, 0, sunX, pathY, SUN_R * 4.5);
      sg.addColorStop(0,   'rgba(255,210,60,'  + (0.55 * pulse) + ')');
      sg.addColorStop(0.35,'rgba(255,130,20,0.22)');
      sg.addColorStop(1,   'rgba(255,80,0,0)');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.arc(sunX, pathY, SUN_R * 4.5, 0, Math.PI * 2);
      ctx.fill();

      var sc = ctx.createRadialGradient(sunX - 7, pathY - 7, 0, sunX, pathY, SUN_R);
      sc.addColorStop(0,   '#fffbe8');
      sc.addColorStop(0.45,'#ffc030');
      sc.addColorStop(1,   '#ff7200');
      ctx.fillStyle = sc;
      ctx.beginPath();
      ctx.arc(sunX, pathY, SUN_R, 0, Math.PI * 2);
      ctx.fill();

      // Path
      ctx.beginPath();
      ctx.moveTo(pathStart, pathY);
      ctx.lineTo(pathEnd, pathY);
      ctx.strokeStyle = 'rgba(255,255,255,0.07)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Stop dots
      for (var j = 1; j <= STOPS; j++) {
        var sx = stopX(j);
        var isCur = (j === currentStop);
        ctx.beginPath();
        ctx.arc(sx, pathY, isCur ? 3.5 : 2, 0, Math.PI * 2);
        ctx.fillStyle = isCur
          ? (locked ? '#7ec8a4' : 'rgba(255,255,255,0.75)')
          : 'rgba(255,255,255,0.16)';
        ctx.fill();
      }

      // Earth
      var ex = stopX(currentStop);
      var glowR  = locked ? '#7ec8a4' : '#4a9eff';
      var glowA0 = locked ? 'rgba(126,200,164,' : 'rgba(74,158,255,';

      var eg = ctx.createRadialGradient(ex, pathY, 0, ex, pathY, EARTH_R * 4);
      eg.addColorStop(0, glowA0 + (locked ? '0.45)' : '0.3)'));
      eg.addColorStop(1, glowA0 + '0)');
      ctx.fillStyle = eg;
      ctx.beginPath();
      ctx.arc(ex, pathY, EARTH_R * 4, 0, Math.PI * 2);
      ctx.fill();

      var ec = ctx.createRadialGradient(ex - 3, pathY - 3, 0, ex, pathY, EARTH_R);
      if (locked) {
        ec.addColorStop(0, '#c8edd8');
        ec.addColorStop(1, '#2a9a60');
      } else {
        ec.addColorStop(0, '#a0d8ff');
        ec.addColorStop(1, '#1060c0');
      }
      ctx.fillStyle = ec;
      ctx.beginPath();
      ctx.arc(ex, pathY, EARTH_R, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // Touch
    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      if (completed || locked) return;
      dragging = true;
      hint.classList.remove('visible');
      currentStop = nearestStop(e.touches[0].clientX);
    }, { passive: false });

    canvas.addEventListener('touchmove', function (e) {
      e.preventDefault();
      if (!dragging || completed || locked) return;
      currentStop = nearestStop(e.touches[0].clientX);
    }, { passive: false });

    canvas.addEventListener('touchend', function (e) {
      e.preventDefault();
      if (!dragging) return;
      dragging = false;
      if (currentStop === TARGET && !locked) {
        onLock();
      }
    }, { passive: false });

    function onLock() {
      locked = true;
      setTimeout(function () {
        if (!locked) return;
        revealEl.classList.add('visible');
        setTimeout(function () {
          if (locked && !completed) onComplete();
        }, 2000);
      }, 2000);
    }

    function onComplete() {
      completed = true;
      setTimeout(function () {
        completeLevel('../brainrot/', 4);
      }, 600);
    }
  </script>
</body>
</html>
