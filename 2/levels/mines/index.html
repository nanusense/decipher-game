<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DECIPHER 2</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../style.css">
  <style>
    :root { --level-accent: #111; }

    body {
      background: #cce4ef;
      overflow: hidden;
      padding: 0;
    }

    #bwCanvas {
      position: fixed;
      inset: 0;
      touch-action: none;
      display: block;
    }

    #boom {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: 4.5rem;
      letter-spacing: 0.12em;
      color: #cc1010;
      text-shadow: 0 3px 0 #7a0000, 0 6px 24px rgba(180,0,0,0.35);
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    #boom.show { opacity: 1; }

  </style>
</head>
<body>
  <span class="badge">46</span>
  <canvas id="bwCanvas"></canvas>
  <div id="boom">BOOM</div>

  <script src="../../utils2.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var divs = document.body.getElementsByTagName('div');
      for (var i = divs.length - 1; i >= 0; i--) {
        var s = divs[i].style;
        if (s.position === 'fixed' && s.bottom === '0.9rem' && s.zIndex === '50') {
          divs[i].style.display = 'none';
          break;
        }
      }
    });
  </script>
  <script>
    desktopBlock();

    var canvas = document.getElementById('bwCanvas');
    var ctx    = canvas.getContext('2d');
    var boomEl = document.getElementById('boom');

    var W, H;
    var RADIUS   = 30;
    var SPACING  = 70;
    var MINE_PCT = 0.12;

    var cols, rows, grid, bubbles;
    var total, safeTotal, revealedCount;
    var minesPlaced, gameOver, completed;
    var blastBubble = null;   // reference to the hit mine bubble
    var particles   = [];
    var looping     = false;

    var NUM_CLR    = ['', '#1565c0', '#2e7d32', '#c62828', '#1a237e', '#6a1010', '#00695c', '#212121', '#546e7a'];
    var CELEB_CLR  = ['#7ec8a4', '#5aaa80', '#a8e6c4', '#ffd700', '#ffffff'];

    // ── Audio ──
    var audioCtx = null;
    function getAC() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playPop() {
      var ac = getAC(), t = ac.currentTime;
      var vol = 0.8 + Math.random() * 0.25;

      var dur  = Math.floor(ac.sampleRate * 0.055);
      var buf  = ac.createBuffer(1, dur, ac.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < dur; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / dur, 1.8);
      var src = ac.createBufferSource(); src.buffer = buf;
      var flt = ac.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.value = 850 + Math.random() * 450; flt.Q.value = 0.9;
      var ng  = ac.createGain(); ng.gain.setValueAtTime(vol, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.055);
      src.connect(flt); flt.connect(ng); ng.connect(ac.destination); src.start(t);

      var osc = ac.createOscillator(); osc.type = 'sine';
      osc.frequency.setValueAtTime(170 + Math.random() * 50, t);
      osc.frequency.exponentialRampToValueAtTime(55, t + 0.07);
      var og = ac.createGain(); og.gain.setValueAtTime(0.25 * vol, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      osc.connect(og); og.connect(ac.destination); osc.start(t); osc.stop(t + 0.08);
    }

    function playBoom() {
      var ac = getAC(), t = ac.currentTime;

      // Deep thud
      var o1 = ac.createOscillator(); o1.type = 'sine';
      o1.frequency.setValueAtTime(90, t); o1.frequency.exponentialRampToValueAtTime(22, t + 0.5);
      var g1 = ac.createGain(); g1.gain.setValueAtTime(0.9, t); g1.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      o1.connect(g1); g1.connect(ac.destination); o1.start(t); o1.stop(t + 0.5);

      // Mid crunch
      var o2 = ac.createOscillator(); o2.type = 'sawtooth';
      o2.frequency.setValueAtTime(140, t); o2.frequency.exponentialRampToValueAtTime(40, t + 0.3);
      var g2 = ac.createGain(); g2.gain.setValueAtTime(0.45, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o2.connect(g2); g2.connect(ac.destination); o2.start(t); o2.stop(t + 0.3);

      // Noise burst
      var dur  = Math.floor(ac.sampleRate * 0.22);
      var buf  = ac.createBuffer(1, dur, ac.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < dur; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / dur, 1.1);
      var ns = ac.createBufferSource(); ns.buffer = buf;
      var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 800;
      var ng = ac.createGain(); ng.gain.setValueAtTime(1.4, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      ns.connect(lp); lp.connect(ng); ng.connect(ac.destination); ns.start(t);
    }

    // ── Particles ──
    var PARTICLE_COLORS = ['#ff3010', '#ff6020', '#ff9030', '#ffcc40', '#ff1a1a'];

    function spawnParticles(x, y) {
      var count = 22;
      for (var i = 0; i < count; i++) {
        var angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
        var speed = 5 + Math.random() * 9;
        particles.push({
          x:     x,
          y:     y,
          vx:    Math.cos(angle) * speed,
          vy:    Math.sin(angle) * speed - 1.5,
          r:     3.5 + Math.random() * 5,
          alpha: 1,
          color: PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)]
        });
      }
    }

    function spawnCelebParticles(x, y) {
      for (var i = 0; i < 10; i++) {
        var angle = Math.random() * Math.PI * 2;
        var speed = 2 + Math.random() * 4;
        particles.push({
          x:     x,
          y:     y,
          vx:    Math.cos(angle) * speed,
          vy:    Math.sin(angle) * speed - 1.5,
          r:     2 + Math.random() * 3.5,
          alpha: 1,
          color: CELEB_CLR[Math.floor(Math.random() * CELEB_CLR.length)]
        });
      }
    }

    // ── Grid ──
    function initGrid() {
      cols          = Math.floor((W - RADIUS) / SPACING) + 1;
      rows          = Math.floor((H - RADIUS) / SPACING) + 1;
      total         = cols * rows;
      safeTotal     = 0;
      revealedCount = 0;
      minesPlaced   = false;
      gameOver      = false;
      blastBubble   = null;
      particles     = [];

      var offsetX = (W - (cols - 1) * SPACING) / 2;
      var offsetY = (H - (rows - 1) * SPACING) / 2;

      grid    = [];
      bubbles = [];

      for (var r = 0; r < rows; r++) {
        grid[r] = [];
        for (var c = 0; c < cols; c++) {
          var b = {
            x: offsetX + c * SPACING,
            y: offsetY + r * SPACING,
            row: r, col: c,
            hidden:    true,
            isMine:    false,
            isHit:     false,
            mineShow:  false,
            mineWon:   false,
            wonAt:     0,
            adjCount:  0,
            popAt:     0,
            blastAt:   0,
            shakeEnd:  0,
            shakeAmp:  0
          };
          grid[r][c] = b;
          bubbles.push(b);
        }
      }
    }

    function getNeighbors(b) {
      var nn = [];
      for (var dr = -1; dr <= 1; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          var r = b.row + dr, c = b.col + dc;
          if (r >= 0 && r < rows && c >= 0 && c < cols) nn.push(grid[r][c]);
        }
      }
      return nn;
    }

    function placeMines(firstB) {
      var safe = {};
      safe[firstB.row + ',' + firstB.col] = true;
      getNeighbors(firstB).forEach(function (n) { safe[n.row + ',' + n.col] = true; });

      var pool = bubbles.filter(function (b) { return !safe[b.row + ',' + b.col]; });
      for (var i = pool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }

      var mineCount = Math.max(5, Math.floor(total * MINE_PCT));
      for (var i = 0; i < mineCount && i < pool.length; i++) pool[i].isMine = true;

      bubbles.forEach(function (b) {
        if (b.isMine) return;
        b.adjCount = getNeighbors(b).filter(function (n) { return n.isMine; }).length;
      });

      safeTotal   = total - mineCount;
      minesPlaced = true;
    }

    // ── Reveal BFS ──
    function reveal(startB) {
      var queue   = [startB];
      var seen    = {};
      var idx     = 0;
      var baseNow = Date.now();

      while (queue.length) {
        var b   = queue.shift();
        var key = b.row + ',' + b.col;
        if (seen[key] || !b.hidden || b.isMine) continue;
        seen[key] = true;

        b.hidden = false;
        b.popAt  = baseNow + idx * 22;
        revealedCount++;
        idx++;

        if (b.adjCount === 0) {
          getNeighbors(b).forEach(function (n) {
            if (!seen[n.row + ',' + n.col]) queue.push(n);
          });
        }
      }
    }

    // ── Draw ──
    function drawBubble(b, now) {
      var x = b.x, y = b.y;

      // Neighbour shake offset
      if (b.shakeEnd && now < b.shakeEnd) {
        var st = (b.shakeEnd - now) / 600;
        var sa = b.shakeAmp * st;
        x += Math.sin(now * 0.09 + b.col * 1.3) * sa;
        y += Math.cos(now * 0.07 + b.row * 1.1) * sa;
      }

      // ── Mine: triggered ──
      if (b.isHit) {
        var age = Math.min(1, (now - b.blastAt) / 700);
        var r   = RADIUS * (1 + age * 0.65);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(230, 25, 10, ' + (0.92 - age * 0.4) + ')';
        ctx.fill();
        // 6 expanding rings at staggered delays
        for (var ri = 0; ri < 6; ri++) {
          var rStart = ri * 70;
          var rAge   = Math.min(1, (now - b.blastAt - rStart) / 380);
          if (rAge <= 0) continue;
          ctx.beginPath();
          ctx.arc(x, y, RADIUS * (1 + rAge * 1.8), 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, ' + Math.round(60 + ri * 20) + ', 20, ' + (0.6 * (1 - rAge)) + ')';
          ctx.lineWidth   = 2.5 - ri * 0.25;
          ctx.stroke();
        }
        return;
      }

      // ── Mine: victory reveal ──
      if (b.mineWon) {
        var wonAge = Math.min(1, (now - b.wonAt) / 320);
        var r      = RADIUS * (0.25 + wonAge * 0.75); // grows in

        var g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.04, x, y, r);
        g.addColorStop(0,    'rgba(210,255,235,0.97)');
        g.addColorStop(0.25, 'rgba(140,215,178,0.90)');
        g.addColorStop(0.7,  'rgba(90,170,130,0.83)');
        g.addColorStop(1,    'rgba(60,140,100,0.77)');

        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();

        ctx.strokeStyle = 'rgba(80, 170, 120, 0.4)';
        ctx.lineWidth   = 0.8;
        ctx.stroke();

        // Glint
        var hg = ctx.createRadialGradient(x - r * 0.28, y - r * 0.3, 0, x - r * 0.28, y - r * 0.3, r * 0.4);
        hg.addColorStop(0,   'rgba(255,255,255,0.75)');
        hg.addColorStop(1,   'rgba(255,255,255,0)');
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(x - r * 0.25, y - r * 0.28, r * 0.28, r * 0.17, -0.42, 0, Math.PI * 2);
        ctx.fillStyle = hg;
        ctx.fill();
        ctx.restore();

        // Star — fades in after bubble expands
        if (wonAge > 0.45) {
          var starA = Math.min(1, (wonAge - 0.45) / 0.55);
          ctx.save();
          ctx.globalAlpha    = starA * 0.92;
          ctx.font           = 'bold ' + Math.round(RADIUS * 0.72) + 'px serif';
          ctx.textAlign      = 'center';
          ctx.textBaseline   = 'middle';
          ctx.fillStyle      = '#ffffff';
          ctx.fillText('★', x, y + 1);
          ctx.restore();
        }

        // Ripple ring as it appears
        if (wonAge < 1) {
          ctx.beginPath();
          ctx.arc(x, y, RADIUS * (0.6 + wonAge * 0.8), 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(100, 210, 150, ' + (0.55 * (1 - wonAge)) + ')';
          ctx.lineWidth   = 2;
          ctx.stroke();
        }
        return;
      }

      // ── Mine: revealed after explosion ──
      if (b.mineShow) {
        ctx.beginPath();
        ctx.arc(x, y, RADIUS * 0.88, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(195, 55, 45, 0.62)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(170, 35, 25, 0.5)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        var s = RADIUS * 0.35;
        ctx.strokeStyle = 'rgba(255,255,255,0.88)';
        ctx.lineWidth   = 2.2;
        ctx.lineCap     = 'round';
        ctx.beginPath();
        ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s);
        ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s);
        ctx.stroke();
        return;
      }

      // ── Revealed safe ──
      if (!b.hidden) {
        var revAge = b.popAt ? (now - b.popAt) / 180 : 1;
        if (revAge < 0) { drawHidden(x, y); return; }
        revAge = Math.min(1, revAge);

        if (revAge < 1) {
          ctx.beginPath();
          ctx.arc(x, y, RADIUS * (1 + (1 - revAge) * 0.5), 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(160, 210, 230, ' + (0.5 * (1 - revAge)) + ')';
          ctx.lineWidth   = 1.5;
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(x, y, RADIUS * 0.86, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(170, 205, 218, 0.3)';
        ctx.fill();

        ctx.save();
        ctx.strokeStyle = 'rgba(120, 170, 190, 0.42)';
        ctx.lineWidth = 0.9;
        ctx.lineCap   = 'round';
        ctx.beginPath();
        ctx.moveTo(x - RADIUS * 0.38, y - RADIUS * 0.1);
        ctx.lineTo(x + RADIUS * 0.3,  y + RADIUS * 0.2);
        ctx.moveTo(x - RADIUS * 0.12, y + RADIUS * 0.28);
        ctx.lineTo(x + RADIUS * 0.28, y - RADIUS * 0.24);
        ctx.stroke();
        ctx.restore();

        if (b.adjCount > 0) {
          ctx.font            = 'bold ' + Math.round(RADIUS * 0.85) + 'px Courier New, monospace';
          ctx.textAlign       = 'center';
          ctx.textBaseline    = 'middle';
          ctx.fillStyle       = NUM_CLR[b.adjCount] || '#111';
          ctx.fillText(b.adjCount, x, y + 1);
        }
        return;
      }

      // ── Hidden (unpopped) ──
      drawHidden(x, y);
    }

    function drawHidden(x, y) {
      var r = RADIUS;
      var g = ctx.createRadialGradient(x - r * 0.32, y - r * 0.32, r * 0.04, x, y, r);
      g.addColorStop(0,    'rgba(255,255,255,0.96)');
      g.addColorStop(0.18, 'rgba(228,244,254,0.90)');
      g.addColorStop(0.65, 'rgba(183,220,240,0.83)');
      g.addColorStop(1,    'rgba(148,198,224,0.77)');
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = 'rgba(118, 184, 214, 0.38)';
      ctx.lineWidth = 0.8;
      ctx.stroke();

      var hg = ctx.createRadialGradient(x - r * 0.3, y - r * 0.31, 0, x - r * 0.3, y - r * 0.31, r * 0.42);
      hg.addColorStop(0,   'rgba(255,255,255,0.78)');
      hg.addColorStop(0.6, 'rgba(255,255,255,0.18)');
      hg.addColorStop(1,   'rgba(255,255,255,0)');
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(x - r * 0.27, y - r * 0.3, r * 0.3, r * 0.18, -0.42, 0, Math.PI * 2);
      ctx.fillStyle = hg;
      ctx.fill();
      ctx.restore();
    }

    // ── Render loop ──
    function render() {
      var now = Date.now();
      ctx.clearRect(0, 0, W, H);

      ctx.fillStyle = '#cce4ef';
      ctx.fillRect(0, 0, W, H);


      var needsAnim = false;

      for (var i = 0; i < bubbles.length; i++) {
        var b = bubbles[i];
        drawBubble(b, now);
        if (!b.hidden  && b.popAt  && now < b.popAt   + 220) needsAnim = true;
        if (b.isHit    && now < b.blastAt + 750)              needsAnim = true;
        if (b.shakeEnd && now < b.shakeEnd)                   needsAnim = true;
        if (b.mineWon  && now < b.wonAt   + 350)              needsAnim = true;
      }

      // Particles
      ctx.save();
      for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x     += p.vx;
        p.y     += p.vy;
        p.vy    += 0.28;   // gravity
        p.vx    *= 0.97;   // drag
        p.alpha -= 0.020;
        p.r     *= 0.978;
        if (p.alpha <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle   = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      if (particles.length > 0) needsAnim = true;

      // Brief red screen flash right at impact
      if (blastBubble && now < blastBubble.blastAt + 160) {
        var flashAge = (now - blastBubble.blastAt) / 160;
        ctx.globalAlpha = (1 - flashAge) * 0.38;
        ctx.fillStyle   = '#ff1a00';
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
        needsAnim = true;
      }

      if (needsAnim) {
        requestAnimationFrame(render);
      } else {
        looping = false;
      }
    }

    function kick() {
      if (!looping) { looping = true; requestAnimationFrame(render); }
    }

    // ── Hit test ──
    function hitBubble(px, py) {
      for (var i = 0; i < bubbles.length; i++) {
        if (!bubbles[i].hidden) continue;
        var dx = px - bubbles[i].x, dy = py - bubbles[i].y;
        if (dx * dx + dy * dy <= RADIUS * RADIUS) return bubbles[i];
      }
      return null;
    }

    // ── Win ──
    function checkWin() {
      if (revealedCount >= safeTotal && !gameOver && !completed) onComplete();
    }

    // ── Explosion ──
    function shakeNeighbors(hitB) {
      var shakeEnd = Date.now() + 620;
      bubbles.forEach(function (b) {
        if (b === hitB) return;
        var dx   = b.x - hitB.x, dy = b.y - hitB.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < SPACING * 3) {
          b.shakeEnd = shakeEnd;
          b.shakeAmp = Math.max(1.5, (1 - dist / (SPACING * 3)) * 11);
        }
      });
    }

    function triggerExplosion(b) {
      gameOver    = true;
      b.isHit     = true;
      b.hidden    = false;
      b.blastAt   = Date.now();
      blastBubble = b;

      playBoom();
      spawnParticles(b.x, b.y);
      shakeNeighbors(b);
      if (navigator.vibrate) navigator.vibrate([15, 30, 60, 20, 40]);
      kick();

      // Show BOOM
      setTimeout(function () {
        boomEl.classList.add('show');
      }, 80);

      // Reveal other mines
      setTimeout(function () {
        bubbles.forEach(function (bb) {
          if (bb.isMine && !bb.isHit) bb.mineShow = true;
        });
        kick();
      }, 450);

      // Hide BOOM and reset board
      setTimeout(function () {
        boomEl.classList.remove('show');
        initGrid();
        kick();
      }, 2200);
    }

    // ── Complete — staggered mine victory reveal ──
    function onComplete() {
      completed = true;

      // Sort mines: centre-outward so they radiate from middle
      var cx    = W / 2, cy = H / 2;
      var mines = bubbles.filter(function (b) { return b.isMine; });
      mines.sort(function (a, b) {
        var da = (a.x - cx) * (a.x - cx) + (a.y - cy) * (a.y - cy);
        var db = (b.x - cx) * (b.x - cx) + (b.y - cy) * (b.y - cy);
        return da - db;
      });

      var STAGGER = 75; // ms between each mine reveal

      mines.forEach(function (b, i) {
        setTimeout(function () {
          b.mineWon = true;
          b.wonAt   = Date.now();
          spawnCelebParticles(b.x, b.y);
          kick();
        }, i * STAGGER);
      });

      // Fade to white after all mines done + a beat to breathe
      var totalDelay = mines.length * STAGGER + 3000;
      setTimeout(function () {
        completeLevel('../matrix/', 16);
      }, totalDelay);
    }

    // ── Touch ──
    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      if (completed || gameOver) return;
      var t = e.changedTouches[0];
      var b = hitBubble(t.clientX, t.clientY);
      if (!b) return;

      if (!minesPlaced) placeMines(b);

      if (b.isMine) {
        triggerExplosion(b);
      } else {
        reveal(b);
        playPop();
        if (navigator.vibrate) navigator.vibrate(10);
        kick();
        checkWin();
      }
    }, { passive: false });

    // ── Init ──
    function resize() {
      W = canvas.width  = window.innerWidth;
