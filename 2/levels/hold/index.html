<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DECIPHER 2</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .home-link { color: rgba(255,255,255,0.15); z-index: 10; }

    /* ── Orb ── */
    #orb-wrap {
      position: relative;
      width: min(72vw, 300px);
      height: min(72vw, 300px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #orb {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 36%,
        rgba(255,255,255,0.12) 0%,
        rgba(255,255,255,0.04) 45%,
        rgba(255,255,255,0.01) 100%);
      border: 1px solid rgba(255,255,255,0.1);
      transition: border-color 0.5s, background 0.5s;
    }

    /* Win glow */
    #orb.won {
      background: radial-gradient(circle at 38% 36%,
        rgba(180,255,180,0.22) 0%,
        rgba(100,220,100,0.08) 45%,
        rgba(0,0,0,0) 100%);
      border-color: rgba(100,220,100,0.4);
    }

    /* ── Text ── */
    #intro {
      text-align: center;
      margin-bottom: 40px;
      transition: opacity 0.6s ease;
    }
    #intro p {
      font-family: 'Courier New', monospace;
      letter-spacing: 0.06em;
      line-height: 1.7;
    }
    #intro .line1 {
      font-size: clamp(0.95rem, 4.5vw, 1.15rem);
      color: rgba(255,255,255,0.75);
    }
    #intro .line2 {
      font-size: clamp(0.72rem, 3.2vw, 0.85rem);
      color: rgba(255,255,255,0.32);
      margin-top: 6px;
      letter-spacing: 0.12em;
    }

    #feedback {
      margin-top: 40px;
      font-family: 'Courier New', monospace;
      font-size: clamp(1.4rem, 7vw, 1.9rem);
      font-weight: bold;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.3);
      min-height: 1.4em;
      text-align: center;
      transition: color 0.3s;
    }
    #feedback .label {
      display: block;
      font-size: clamp(0.65rem, 3vw, 0.78rem);
      font-weight: normal;
      letter-spacing: 0.16em;
      margin-top: 4px;
      opacity: 0.7;
    }
    #feedback.won   { color: rgba(100,220,100,0.9); }
    #feedback.miss  { color: rgba(220,120,80,0.85); }
  </style>
</head>
<body>
  <span class="badge">50</span>
  <a href="../../index.html" class="home-link">HOME</a>

  <div id="intro">
    <p class="line1">This is the end.</p>
    <p class="line2">Hold your breath and count to ten.</p>
  </div>

  <div id="orb-wrap">
    <div id="orb"></div>
  </div>

  <div id="feedback"></div>

  <script src="../../utils2.js"></script>
  <script>
    desktopBlock();

    var TARGET    = 10.0;
    var TOLERANCE = 0.2;

    var holdStart = null;
    var solved    = false;

    var orb        = document.getElementById('orb');
    var intro      = document.getElementById('intro');
    var feedbackEl = document.getElementById('feedback');

    // ── Touch start ──
    document.addEventListener('touchstart', function(e) {
      if (solved) return;
      e.preventDefault();

      holdStart = Date.now();
      feedbackEl.innerHTML = '';
      feedbackEl.className = '';
      intro.style.opacity  = '0.2';
    }, { passive: false });

    // ── Touch end ──
    document.addEventListener('touchend', function(e) {
      if (solved || holdStart === null) return;
      e.preventDefault();

      var elapsed = (Date.now() - holdStart) / 1000;
      holdStart   = null;
      intro.style.opacity = '1';

      var diff    = elapsed - TARGET;
      var absDiff = Math.abs(diff);

      if (absDiff <= TOLERANCE) {
        // ── WIN ──
        solved = true;
        vibrate([20, 40, 20]);

        var isBullseye = elapsed.toFixed(2) === '10.00';
        var winLabel   = isBullseye ? 'Bullseye' : 'Close enough';

        orb.classList.add('won');
        feedbackEl.className = 'won';
        feedbackEl.innerHTML =
          elapsed.toFixed(2) + 's' +
          '<span class="label">' + winLabel + '</span>';
        intro.style.opacity = '0';

        setTimeout(function() {
          completeLevel('../../end.html', 20);
        }, 4000);

      } else {
        // ── MISS ──
        var label = diff < 0 ? 'too short' : 'too long';
        feedbackEl.className = 'miss';
        feedbackEl.innerHTML =
          elapsed.toFixed(2) + 's' +
          '<span class="label">' + label + '</span>';
      }
    }, { passive: false });

    document.addEventListener('touchcancel', function() {
      holdStart = null;
      intro.style.opacity = '1';
    }, { passive: true });
  </script>
</body>
</html>
