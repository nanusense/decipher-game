<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECIPHER</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- SEO -->
  <meta name="description" content="A puzzle game hidden in the browser itself. No instructions. 50 levels. Just you and your browser.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="DECIPHER — No Instructions">
  <meta property="og:description" content="A puzzle game hidden in the browser itself. No instructions. 50 levels. Just you and your browser.">
  <meta property="og:image" content="https://decipher.shiftingradius.com/og-image.svg">
  <meta property="og:url" content="https://decipher.shiftingradius.com">
  <meta property="og:site_name" content="DECIPHER">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DECIPHER — No Instructions">
  <meta name="twitter:description" content="A puzzle game hidden in the browser itself. No instructions. 50 levels. Just you and your browser.">
  <meta name="twitter:image" content="https://decipher.shiftingradius.com/og-image.svg">

  <link rel="stylesheet" href="style.css?v=3">
  <style>
    .btn-col { display: flex; flex-direction: column; gap: 0.75rem; align-items: center; width: 100%; max-width: 200px; }
    .intro { font-size: 0.8rem; color: var(--muted); text-align: center; line-height: 1.8; max-width: 340px; }
  </style>
</head>
<body>
  <div class="page">
    <h1 class="logo">DECIPHER</h1>
    <p class="tagline">NO INSTRUCTIONS</p>
    <div class="line"></div>
    <p class="intro">
      Each level is a puzzle hidden in the page itself.<br>
      No questions. No multiple choice.<br>
      Just you and your browser.
    </p>
    <div class="btn-col">
      <button class="btn btn-accent" id="startBtn">START</button>
      <button class="btn hidden" id="resumeBtn">RESUME</button>
    </div>
    <p style="font-size:0.65rem;color:var(--muted);letter-spacing:0.1em" id="progressTxt"></p>
  </div>

  <script src="utils.js?v=3"></script>
  <script>
    var saved = parseInt(localStorage.getItem('decipherProgress') || '0');
    var startBtn  = document.getElementById('startBtn');
    var resumeBtn = document.getElementById('resumeBtn');
    var progTxt   = document.getElementById('progressTxt');

    if (saved > 0) {
      resumeBtn.classList.remove('hidden');
      progTxt.textContent = saved + ' LEVELS REACHED';
      resumeBtn.addEventListener('click', function () {
        var next = LEVEL_URLS[saved];
        if (next) window.location.href = 'levels/' + next;
      });
    }

    startBtn.addEventListener('click', function () {
      window.location.href = 'levels/start.html';
    });
  </script>
</body>
</html>
