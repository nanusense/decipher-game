<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#080810"/>

  <!-- Subtle grid lines -->
  <g stroke="#7b61ff" stroke-width="0.5" opacity="0.06">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#7b61ff" stroke-width="1.5" opacity="0.4"/>

  <!-- Corner accents -->
  <path d="M24 80 L24 24 L80 24" fill="none" stroke="#00ffc8" stroke-width="2.5"/>
  <path d="M1120 24 L1176 24 L1176 80" fill="none" stroke="#00ffc8" stroke-width="2.5"/>
  <path d="M24 550 L24 606 L80 606" fill="none" stroke="#00ffc8" stroke-width="2.5"/>
  <path d="M1120 606 L1176 606 L1176 550" fill="none" stroke="#00ffc8" stroke-width="2.5"/>

  <!-- Lock icon (left decorative) -->
  <g transform="translate(140, 240)" filter="url(#softglow)" opacity="0.25">
    <rect x="-45" y="0" width="90" height="70" rx="8" fill="#7b61ff"/>
    <path d="M-28 0 V-28 Q-28 -60 0 -60 Q28 -60 28 -28 V0" fill="none" stroke="#7b61ff" stroke-width="8"/>
    <circle cx="0" cy="30" r="12" fill="#080810"/>
    <rect x="-5" y="40" width="10" height="18" rx="3" fill="#080810"/>
  </g>

  <!-- Lock icon (right decorative) -->
  <g transform="translate(1060, 240)" filter="url(#softglow)" opacity="0.25">
    <rect x="-45" y="0" width="90" height="70" rx="8" fill="#7b61ff"/>
    <path d="M-28 0 V-28 Q-28 -60 0 -60 Q28 -60 28 -28 V0" fill="none" stroke="#7b61ff" stroke-width="8"/>
    <circle cx="0" cy="30" r="12" fill="#080810"/>
    <rect x="-5" y="40" width="10" height="18" rx="3" fill="#080810"/>
  </g>

  <!-- Main title -->
  <text x="600" y="268" font-family="Courier New, monospace" font-size="128" font-weight="bold"
        text-anchor="middle" fill="#c8c8e0" filter="url(#glow)" letter-spacing="24">DECIPHER</text>

  <!-- Accent underline -->
  <line x1="240" y1="300" x2="960" y2="300" stroke="#7b61ff" stroke-width="2" opacity="0.6"/>

  <!-- Tagline -->
  <text x="600" y="366" font-family="Courier New, monospace" font-size="26"
        text-anchor="middle" fill="#7b61ff" letter-spacing="12">NO INSTRUCTIONS</text>

  <!-- Description -->
  <text x="600" y="440" font-family="Courier New, monospace" font-size="22"
        text-anchor="middle" fill="#9ca3af" letter-spacing="3">A puzzle game hidden in the browser itself.</text>
  <text x="600" y="476" font-family="Courier New, monospace" font-size="22"
        text-anchor="middle" fill="#9ca3af" letter-spacing="3">50 levels. Just you and your browser.</text>

  <!-- Teal dot decoration -->
  <circle cx="580" cy="366" r="4" fill="#00ffc8" opacity="0.8"/>
  <circle cx="620" cy="366" r="4" fill="#00ffc8" opacity="0.8"/>
</svg>
