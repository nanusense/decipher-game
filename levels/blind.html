<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECIPHER</title>
  <link rel="stylesheet" href="../style.css?v=3">
  <style>
    .roaming-clue {
      position: fixed;
      top: 0;
      left: 0;
      transform: translate(-50%, -50%);
      font-family: var(--font);
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      color: var(--text);
      line-height: 1.9;
      text-align: center;
      pointer-events: none;
      transition: transform 0.05s linear;
      max-width: 300px;
      will-change: left, top;
    }

    .success-msg {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .success-msg.show {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <span class="badge">16</span>
  <a href="../index.html" class="home-link">HOME</a>

  <div class="roaming-clue" id="clue">
    'Cause the players gonna play, play, play, play, play<br>
    And the haters gonna hate, hate, hate, hate, hate<br>
    Baby, I'm just gonna…
  </div>

  <div class="success-msg" id="successMsg">
    <p class="clue">Shake it off.</p>
    <button class="btn btn-accent" id="goBtn">CONTINUE</button>
  </div>

  <script src="../utils.js?v=3"></script>
  <script>
    trackProgress(16);

    var clueEl     = document.getElementById('clue');
    var successEl  = document.getElementById('successMsg');
    var done       = false;

    var THRESHOLD  = 4000; /* total px to travel before triggering */
    var totalDist  = 0;
    var lastX      = null;
    var lastY      = null;
    var held       = false;

    /* centre clue on load */
    var cx = window.innerWidth  / 2;
    var cy = window.innerHeight / 2;
    clueEl.style.left = cx + 'px';
    clueEl.style.top  = cy + 'px';

    function moveTo(x, y) {
      if (done || !held) return;

      if (lastX !== null) {
        var dx = x - lastX;
        var dy = y - lastY;
        totalDist += Math.sqrt(dx * dx + dy * dy);
        if (totalDist >= THRESHOLD) {
          trigger();
          return;
        }
      }

      lastX = x;
      lastY = y;

      clueEl.style.left = x + 'px';
      clueEl.style.top  = y + 'px';
    }

    function trigger() {
      if (done) return;
      done = true;
      clueEl.style.display = 'none';
      successEl.classList.add('show');
    }

    /* mouse — only while button held down */
    document.addEventListener('mousedown', function (e) {
      held  = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });
    document.addEventListener('mouseup',   function () { held = false; lastX = null; lastY = null; });
    document.addEventListener('mousemove', function (e) { moveTo(e.clientX, e.clientY); });

    /* touch — only while finger held down */
    document.addEventListener('touchstart', function (e) {
      held  = true;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchend',   function () { held = false; lastX = null; lastY = null; });
    document.addEventListener('touchmove',  function (e) {
      e.preventDefault();
      moveTo(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    document.getElementById('goBtn').addEventListener('click', function () {
      completeLevel('pattern.html', 16);
    });
  </script>
</body>
</html>
