<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECIPHER</title>
  <link rel="stylesheet" href="../style.css?v=3">
</head>
<body>
  <span class="badge">22</span>
  <a href="../index.html" class="home-link">HOME</a>

  <div class="page">
    <p class="clue">Knock knock won't work here.</p>
  </div>

  <script src="../utils.js?v=3"></script>
  <script>
    trackProgress(22);

    var taps     = [];
    var WINDOW   = 600; /* ms — three taps must land within this window */
    var solved   = false;

    function onTap() {
      if (solved) return;
      var now = Date.now();
      taps.push(now);
      taps = taps.filter(function (t) { return now - t < WINDOW; });
      if (taps.length >= 3) {
        solved = true;
        completeLevel('query.html', 22);
      }
    }

    document.addEventListener('pointerdown', onTap);
  </script>
</body>
</html>
