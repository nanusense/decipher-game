<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECIPHER</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .swipe-container { width: 100%; max-width: 400px; overflow: hidden; position: relative; }
    .swipe-inner { display: flex; transition: transform 0.4s ease; }
    .panel {
      min-width: 100%; padding: 2rem 1rem;
      display: flex; flex-direction: column;
      align-items: center; gap: 1.5rem;
    }
    .arrow-hint {
      position: absolute; right: 0; top: 50%;
      transform: translateY(-50%);
      font-size: 1.5rem; color: var(--border);
      animation: nudge 1.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes nudge {
      0%,100% { transform: translateY(-50%) translateX(0); }
      50%      { transform: translateY(-50%) translateX(-6px); }
    }
    .arrow-btn {
      background: none; border: 1px solid var(--border);
      font-size: 1.2rem; padding: 0.4rem 0.8rem; cursor: pointer;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <span class="badge">LEVEL 30</span>
  <a href="../index.html" class="home-link">HOME</a>
  <div class="page">
    <h1 class="title">SLIDE</h1>

    <div class="swipe-container" id="sc">
      <div class="swipe-inner" id="inner">
        <div class="panel">
          <p class="clue">Not everything fits on one screen.</p>
          <button class="arrow-btn" id="arrowBtn">→</button>
        </div>
        <div class="panel">
          <p class="clue">You found the other side.</p>
          <button class="btn btn-accent" id="goBtn">CONTINUE</button>
        </div>
      </div>
      <span class="arrow-hint" id="arrowHint">›</span>
    </div>
  </div>
  <script src="../utils.js"></script>
  <script>
    trackProgress(30);
    var inner     = document.getElementById('inner');
    var hint      = document.getElementById('arrowHint');
    var atPanel2  = false;

    function goRight() {
      if (atPanel2) return;
      atPanel2 = true;
      inner.style.transform = 'translateX(-50%)';
      hint.style.display = 'none';
    }

    document.getElementById('arrowBtn').addEventListener('click', goRight);
    onSwipe(document.getElementById('sc'), 'left', goRight);

    document.getElementById('goBtn').addEventListener('click', function () {
      completeLevel('last.html', 30);
    });
  </script>
</body>
</html>
