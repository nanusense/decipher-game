<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECIPHER</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .half-box {
      width: 180px; height: 100px;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; letter-spacing: 0.2em; color: var(--text);
      position: relative;
    }
    .half-label {
      position: absolute; top: 6px; left: 10px;
      font-size: 0.55rem; color: var(--muted); letter-spacing: 0.1em;
    }
    .other-link {
      font-size: 0.65rem; color: var(--muted); letter-spacing: 0.08em;
      text-decoration: none; border-bottom: 1px solid var(--border);
    }
    .other-link:hover { color: var(--text); }
    .side-row { display: flex; gap: 1.5rem; align-items: center; }
    .plus { font-size: 1.5rem; color: var(--border); }
  </style>
</head>
<body>
  <span class="badge">LEVEL 46</span>
  <a href="../index.html" class="home-link">HOME</a>
  <div class="page">
    <h1 class="title">TWO HALVES</h1>

    <div class="side-row">
      <div class="half-box" id="boxA">
        <span class="half-label">THIS PAGE</span>
        <span id="partA">VOI</span>
      </div>
      <span class="plus">+</span>
      <div class="half-box" id="boxB">
        <span class="half-label">OTHER PAGE</span>
        <span id="partB" style="color:var(--border)">???</span>
      </div>
    </div>

    <a href="halves-b.html" class="other-link" id="otherLink">→ visit the other page</a>

    <div class="answer-wrap">
      <input class="answer-input" id="ans" type="text" placeholder="combine both halves…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <p class="clue">Half the truth on each side.</p>
  </div>
  <script src="../utils.js"></script>
  <script>
    trackProgress(46);
    /* If returning from halves-b with the second half stored */
    var second = sessionStorage.getItem('halvesB');
    if (second) {
      document.getElementById('partB').textContent = second;
      document.getElementById('partB').style.color = 'var(--text)';
    }
    bindAnswer('ans', 'voice', 'coords.html', 46);
  </script>
</body>
</html>
