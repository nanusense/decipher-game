<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECIPHER</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .keyhole {
      width: 60px; height: 80px;
      border: 2px solid var(--text);
      border-radius: 30px 30px 0 0;
      position: relative;
    }
    .keyhole::after {
      content: '';
      position: absolute; bottom: -20px; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 22px solid var(--text);
    }
  </style>
</head>
<body>
  <span class="badge">LEVEL 8</span>
  <a href="../index.html" class="home-link">HOME</a>
  <div class="page">
    <h1 class="title">THE CAVE</h1>
    <div class="keyhole"></div>
    <div class="answer-wrap">
      <input class="answer-input" id="ans" type="text" placeholder="…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <p class="clue">Open... what?</p>
  </div>
  <script src="../utils.js"></script>
  <script>
    trackProgress(8);
    bindAnswer('ans', 'sesame', 'letters.html', 10);

    var typed = '';
    document.addEventListener('keydown', function (e) {
      typed += e.key.toLowerCase();
      if (typed.slice(-6) === 'sesame') completeLevel('letters.html', 8);
      if (typed.length > 20) typed = typed.slice(-20);
    });
  </script>
</body>
</html>
