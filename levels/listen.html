<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECIPHER</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .play-btn {
      width: 80px; height: 80px; border-radius: 50%;
      border: 2px solid var(--text);
      background: transparent;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.5rem;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .play-btn:hover { background: var(--surface); }
    .wave {
      display: flex; align-items: flex-end; gap: 3px; height: 40px;
    }
    .bar {
      width: 4px; background: var(--border); border-radius: 2px;
      transition: height 0.1s, background 0.1s;
    }
    .morse-ref {
      font-size: 0.62rem; color: var(--muted);
      border-collapse: collapse; margin: 0 auto;
    }
    .morse-ref td { padding: 2px 10px; }
  </style>
</head>
<body>
  <span class="badge">LEVEL 29</span>
  <a href="../index.html" class="home-link">HOME</a>
  <div class="page">
    <h1 class="title">LISTEN</h1>
    <button class="play-btn" id="playBtn">▶</button>
    <div class="wave" id="wave">
      <div class="bar" style="height:8px"></div>
      <div class="bar" style="height:8px"></div>
      <div class="bar" style="height:8px"></div>
      <div class="bar" style="height:8px"></div>
      <div class="bar" style="height:8px"></div>
      <div class="bar" style="height:8px"></div>
      <div class="bar" style="height:8px"></div>
      <div class="bar" style="height:8px"></div>
    </div>
    <table class="morse-ref">
      <tr><td>····</td><td>= H</td><td>·</td><td>= E</td></tr>
      <tr><td>·–</td><td>= A</td><td>·–·</td><td>= R</td></tr>
    </table>
    <div class="answer-wrap">
      <input class="answer-input" id="ans" type="text" placeholder="…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <p class="clue">Decode what you hear.</p>
  </div>
  <script src="../utils.js"></script>
  <script>
    trackProgress(29);

    /* Web Audio morse: HEAR = ···· · ·– ·–· */
    var ctx = null;
    var DIT = 0.10, DAH = 0.30, GAP = 0.10, LGAP = 0.35;

    /* sequence: 1=dit, 3=dah, 0=letter-gap */
    var SEQ = [1,1,1,1, 0, 1, 0, 1,3, 0, 1,3,1];

    function beep(ac, start, dur) {
      var osc  = ac.createOscillator();
      var gain = ac.createGain();
      osc.connect(gain); gain.connect(ac.destination);
      osc.frequency.value = 600;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.4, start + 0.01);
      gain.gain.setValueAtTime(0.4, start + dur - 0.01);
      gain.gain.linearRampToValueAtTime(0, start + dur);
      osc.start(start); osc.stop(start + dur);
    }

    var bars = document.querySelectorAll('.bar');
    function animateBars(active) {
      bars.forEach(function (b, i) {
        b.style.height  = active ? (10 + Math.random() * 28) + 'px' : '8px';
        b.style.background = active ? 'var(--text)' : 'var(--border)';
      });
    }

    document.getElementById('playBtn').addEventListener('click', function () {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      var t = ctx.currentTime + 0.1;
      SEQ.forEach(function (s) {
        if (s === 0) { t += LGAP; return; }
        var dur = s === 1 ? DIT : DAH;
        beep(ctx, t, dur);
        t += dur + GAP;
      });

      /* simple bar animation during playback */
      var end = t;
      var iv = setInterval(function () {
        if (ctx.currentTime < end) { animateBars(true); }
        else { animateBars(false); clearInterval(iv); }
      }, 80);
    });

    bindAnswer('ans', 'hear', 'slide.html', 29);
  </script>
</body>
</html>
