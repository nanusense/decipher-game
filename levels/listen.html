<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECIPHER</title>
  <link rel="stylesheet" href="../style.css?v=3">
  <style>
    .play-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: border-color 0.2s;
    }
    .play-btn.playing {
      border-color: var(--text);
    }
    .play-btn svg {
      width: 22px;
      height: 22px;
      fill: var(--text);
      margin-left: 3px; /* optical centre for play triangle */
    }
    .wave {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 32px;
    }
    .bar {
      width: 3px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      transition: height 0.08s, background 0.08s;
    }
    .sub {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      color: var(--border);
      text-align: center;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <span class="badge">29</span>
  <a href="../index.html" class="home-link">HOME</a>
  <div class="page">
    <p class="clue">Decode what you hear.</p>

    <button class="play-btn" id="playBtn" aria-label="Play">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <div class="wave" id="wave">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <p class="sub" id="sub">TAP TO PLAY</p>

    <div class="answer-wrap">
      <input class="answer-input" id="ans" type="text" placeholder="…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
  </div>

  <script src="../utils.js?v=3"></script>
  <script>
    trackProgress(29);

    /* BEAT in morse:
       B = −···   E = ·   A = ·−   T = −
       seq: 3=dah  1=dit  0=letter-gap                */
    var SEQ = [3,1,1,1, 0, 1, 0, 1,3, 0, 3];

    var DIT  = 0.10;
    var DAH  = 0.30;
    var GAP  = 0.10;   /* between symbols in same letter */
    var LGAP = 0.70;   /* between letters                */

    var ctx     = null;
    var playing = false;

    var playBtn = document.getElementById('playBtn');
    var sub     = document.getElementById('sub');
    var bars    = document.querySelectorAll('.bar');

    function getCtx() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      return ctx;
    }

    function beep(ac, start, dur) {
      var osc  = ac.createOscillator();
      var gain = ac.createGain();
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.frequency.value = 620;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.35, start + 0.008);
      gain.gain.setValueAtTime(0.35, start + dur - 0.008);
      gain.gain.linearRampToValueAtTime(0, start + dur);
      osc.start(start);
      osc.stop(start + dur);
    }

    function animateBars(active) {
      bars.forEach(function (b) {
        b.style.height     = active ? (4 + Math.random() * 24) + 'px' : '4px';
        b.style.background = active ? 'var(--text)' : 'var(--border)';
      });
    }

    function play() {
      if (playing) return;
      playing = true;
      playBtn.classList.add('playing');
      sub.textContent = '';

      var ac = getCtx();

      function schedule() {
        var t = ac.currentTime + 0.15;

        SEQ.forEach(function (s) {
          if (s === 0) { t += LGAP; return; }
          var dur = s === 1 ? DIT : DAH;
          beep(ac, t, dur);
          t += dur + GAP;
        });

        var endTime = t;
        var iv = setInterval(function () {
          if (ac.currentTime < endTime) {
            animateBars(true);
          } else {
            animateBars(false);
            clearInterval(iv);
            playing = false;
            playBtn.classList.remove('playing');
            sub.textContent = 'TAP TO REPLAY';
          }
        }, 80);
      }

      /* resume suspended context (browser autoplay policy) then play */
      if (ac.state === 'suspended') {
        ac.resume().then(schedule);
      } else {
        schedule();
      }
    }

    playBtn.addEventListener('click', play);

    bindAnswer('ans', 'beat', 'zorro.html', 29);
  </script>
</body>
</html>
