<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECIPHER — 7</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .polaroid {
      background: #fff;
      padding: 14px 14px 48px 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
      display: inline-flex;
      flex-direction: column;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .photo-area {
      width: 200px;
      height: 180px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: background 0.1s;
    }
    .photo-word {
      color: #fff;
      font-size: 1.8rem;
      letter-spacing: 0.25em;
      opacity: 0;
      pointer-events: none;
      font-family: var(--font);
    }
    .photo-word.visible {
      pointer-events: auto;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <span class="badge">LEVEL 7</span>
  <a href="../index.html" class="home-link">HOME</a>
  <div class="page">
    <h1 class="title">DEVELOPING</h1>
    <div class="polaroid" id="polaroid">
      <div class="photo-area" id="photo">
        <span class="photo-word" id="word">STILL</span>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="bar"></div></div>
    <p class="clue">Develop it.</p>
  </div>
  <script src="../utils.js"></script>
  <script>
    trackProgress(7);
    var polaroid = document.getElementById('polaroid');
    var photo    = document.getElementById('photo');
    var word     = document.getElementById('word');
    var bar      = document.getElementById('bar');
    var HOLD = 3000, start = null, raf = null, revealed = false;

    function lerp(a, b, t) { return Math.round(a + (b - a) * t); }

    function tick(ts) {
      if (!start) start = ts;
      var p = Math.min((ts - start) / HOLD, 1);
      bar.style.width = (p * 100) + '%';
      var bg = lerp(17, 160, p);
      photo.style.background = 'rgb(' + bg + ',' + bg + ',' + bg + ')';
      word.style.opacity = p;
      if (p < 1) {
        raf = requestAnimationFrame(tick);
      } else {
        revealed = true;
        word.classList.add('visible');
      }
    }

    function go(e) {
      if (revealed) return;
      e.preventDefault();
      start = null;
      raf = requestAnimationFrame(tick);
    }

    function stop() {
      if (revealed) return;
      cancelAnimationFrame(raf);
      start = null;
      bar.style.width = '0%';
      photo.style.background = '#111';
      word.style.opacity = '0';
    }

    polaroid.addEventListener('mousedown',  go);
    polaroid.addEventListener('touchstart', go,   { passive: false });
    polaroid.addEventListener('mouseup',    stop);
    polaroid.addEventListener('mouseleave', stop);
    polaroid.addEventListener('touchend',   stop);
    polaroid.addEventListener('touchmove',  stop);

    word.addEventListener('click', function () {
      if (revealed) completeLevel('tiny.html', 7);
    });
  </script>
</body>
</html>
