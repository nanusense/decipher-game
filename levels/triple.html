<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECIPHER</title>
  <link rel="stylesheet" href="../style.css?v=3">
  <style>
    .lock-body {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 1.8rem 2.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
    }

    .dials { display: flex; gap: 1rem; align-items: center; }
    .dial-sep { font-size: 1.4rem; color: var(--border); margin-top: 4px; }

    /* ── Drum ── */
    .drum {
      width: 62px;
      height: 168px;          /* 3 × 56px slots */
      position: relative;
      overflow: hidden;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: #fff;
      cursor: grab;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .drum:active { cursor: grabbing; }

    /* selection band — two horizontal rules */
    .drum::before {
      content: '';
      position: absolute;
      left: 6px; right: 6px;
      top: 50%; transform: translateY(-50%);
      height: 56px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      pointer-events: none;
      z-index: 2;
    }

    /* fade top & bottom — strong enough to wash out ghost digits */
    .drum::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.96) 0%,
        rgba(255,255,255,0.55) 26%,
        transparent 38%,
        transparent 62%,
        rgba(255,255,255,0.55) 74%,
        rgba(255,255,255,0.96) 100%
      );
      pointer-events: none;
      z-index: 3;
    }

    .drum-inner {
      position: absolute;
      left: 0; right: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      will-change: transform;
    }

    /* ghost digits — very pale */
    .drum-digit {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-family: var(--font);
      color: rgba(0,0,0,0.18);
      flex-shrink: 0;
      user-select: none;
      transition: color 0.15s, font-size 0.15s;
    }

    /* center (selected) digit — bold and full contrast */
    .drum-digit.active {
      font-size: 2.4rem;
      color: var(--text);
      font-weight: bold;
    }

    /* success state */
    .dials.correct .drum { border-color: var(--success); }
    .dials.correct .drum::before { border-color: var(--success); }

    .lock-icon {
      font-size: 2rem; cursor: pointer;
      transition: transform 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .lock-icon:active { transform: scale(0.92); }
    .lock-msg { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.12em; min-height: 1em; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-7px); }
      75%      { transform: translateX(7px); }
    }
    .shake { animation: shake 0.32s ease; }
  </style>
</head>
<body>
  <span class="badge">11</span>
  <a href="../index.html" class="home-link">HOME</a>
  <div class="page">
    <h1 class="title">CALL THE DEVIL</h1>
    <div class="lock-body" id="lockBody">
      <div class="dials" id="dials"></div>
      <div class="lock-icon" id="lockIcon">🔒</div>
      <div class="lock-msg" id="lockMsg"></div>
    </div>
    <p class="clue">The number of the beast.</p>
  </div>
  <script src="../utils.js?v=3"></script>
  <script>
    trackProgress(11);

    var SLOT    = 56;           // px per digit slot
    var REPS    = 3;            // how many times 0-9 is repeated
    var TOTAL   = 10 * REPS;   // 30 items
    var MID     = 10;           // start in the middle group
    var TARGET  = [6, 6, 6];
    var values  = [0, 0, 0];
    var unlocked = false;

    /* ── translateY to center item [idx] in the 3-slot window ── */
    function yFor(idx) { return SLOT - idx * SLOT; }   /* = SLOT*(1-idx) */

    /* ── clamp index inside [1 … TOTAL-2] so prev/next always exist ── */
    function clampIdx(i) { return Math.max(1, Math.min(TOTAL - 2, i)); }

    function createDrum(dialIndex) {
      var wrap  = document.createElement('div');
      wrap.className = 'drum';
      var inner = document.createElement('div');
      inner.className = 'drum-inner';

      /* 30 digit elements */
      for (var r = 0; r < REPS; r++) {
        for (var d = 0; d < 10; d++) {
          var el = document.createElement('div');
          el.className = 'drum-digit';
          el.textContent = d;
          inner.appendChild(el);
        }
      }
      wrap.appendChild(inner);

      /* state */
      var s = {
        idx:       MID + values[dialIndex],
        translate: 0,   /* mirrors current CSS translateY */
        startY:    null,
        startTr:   null,
        dragging:  false
      };
      s.translate = yFor(s.idx);
      inner.style.transform = 'translateY(' + s.translate + 'px)';

      /* mark initial center digit */
      inner.querySelectorAll('.drum-digit').forEach(function (el, i) {
        el.classList.toggle('active', i === s.idx);
      });

      function markActive(idx) {
        inner.querySelectorAll('.drum-digit').forEach(function (el, i) {
          el.classList.toggle('active', i === idx);
        });
      }

      function snap(rawIdx) {
        var idx = clampIdx(Math.round(rawIdx));
        s.idx = idx;
        values[dialIndex] = idx % 10;
        s.translate = yFor(idx);
        inner.style.transition = 'transform 0.22s cubic-bezier(0.25, 0.8, 0.35, 1)';
        inner.style.transform  = 'translateY(' + s.translate + 'px)';
        markActive(idx);
        setTimeout(function () { inner.style.transition = ''; }, 240);
      }

      function idxFromTranslate(tr) { return (SLOT - tr) / SLOT; }

      /* ── touch ── */
      wrap.addEventListener('touchstart', function (e) {
        if (unlocked) return;
        e.preventDefault();
        inner.style.transition = '';
        s.startY  = e.touches[0].clientY;
        s.startTr = s.translate;
        s.dragging = true;
      }, { passive: false });

      wrap.addEventListener('touchmove', function (e) {
        if (!s.dragging) return;
        e.preventDefault();
        var dy = e.touches[0].clientY - s.startY;
        s.translate = s.startTr + dy;
        inner.style.transform = 'translateY(' + s.translate + 'px)';
      }, { passive: false });

      wrap.addEventListener('touchend', function (e) {
        if (!s.dragging) return;
        s.dragging = false;
        snap(idxFromTranslate(s.translate));
      });

      /* ── mouse drag (desktop) ── */
      wrap.addEventListener('mousedown', function (e) {
        if (unlocked) return;
        inner.style.transition = '';
        s.startY  = e.clientY;
        s.startTr = s.translate;
        s.dragging = true;

        function onMove(ev) {
          if (!s.dragging) return;
          var dy = ev.clientY - s.startY;
          s.translate = s.startTr + dy;
          inner.style.transform = 'translateY(' + s.translate + 'px)';
        }
        function onUp(ev) {
          if (!s.dragging) return;
          s.dragging = false;
          snap(idxFromTranslate(s.translate));
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      /* ── scroll wheel (desktop) ── */
      wrap.addEventListener('wheel', function (e) {
        if (unlocked) return;
        e.preventDefault();
        snap(s.idx + (e.deltaY > 0 ? 1 : -1));
      }, { passive: false });

      return wrap;
    }

    /* build 3 drums */
    var dialsEl = document.getElementById('dials');
    for (var i = 0; i < 3; i++) {
      if (i > 0) {
        var sep = document.createElement('div');
        sep.className = 'dial-sep';
        sep.textContent = '·';
        dialsEl.appendChild(sep);
      }
      dialsEl.appendChild(createDrum(i));
    }

    /* lock button */
    document.getElementById('lockIcon').addEventListener('click', function () {
      if (unlocked) return;
      if (values[0] === TARGET[0] && values[1] === TARGET[1] && values[2] === TARGET[2]) {
        unlocked = true;
        document.getElementById('lockIcon').textContent = '🔓';
        document.getElementById('dials').classList.add('correct');
        document.getElementById('lockMsg').textContent = 'unlocked';
        setTimeout(function () { completeLevel('hunt.html', 11); }, 900);
      } else {
        var lb = document.getElementById('lockBody');
        lb.classList.remove('shake');
        void lb.offsetWidth;
        lb.classList.add('shake');
        document.getElementById('lockMsg').textContent = 'try again';
        setTimeout(function () { document.getElementById('lockMsg').textContent = ''; }, 1000);
      }
    });
  </script>
</body>
</html>
