<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECIPHER</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .num-sequence {
      font-size: 2.5rem; letter-spacing: 0.3em; color: var(--text);
    }
    .alpha-key {
      font-size: 0.62rem; color: var(--muted);
      letter-spacing: 0.08em; text-align: center; line-height: 1.8;
    }
  </style>
</head>
<body>
  <span class="badge">LEVEL 32</span>
  <a href="../index.html" class="home-link">HOME</a>
  <div class="page">
    <h1 class="title">BY THE NUMBERS</h1>
    <div class="num-sequence">4 · 5 · 5 · 16</div>
    <p class="alpha-key">A=1 &nbsp; B=2 &nbsp; C=3 &nbsp; … &nbsp; Z=26</p>
    <div class="answer-wrap">
      <input class="answer-input" id="ans" type="text" placeholder="…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <p class="clue">Every number has a name.</p>
  </div>
  <script src="../utils.js"></script>
  <script>
    trackProgress(32);
    bindAnswer('ans', 'deep', 'emoji.html', 32);
  </script>
</body>
</html>
